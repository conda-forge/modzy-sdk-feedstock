{% set name = "modzy-sdk" %}
{% set version = "0.7.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/modzy-sdk-{{ version }}.tar.gz
  sha256: af10c556b197f7805879c35268f3f2548e5ada0732fd2237fd3ed02e92d83910

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - deprecation
    - google-api-python-client
    - grpcio
    - protobuf
    - python >={{ python_min }}
    - python-dotenv
    - requests

test:
  imports:
    - modzy
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/modzy/sdk-python
  summary: Modzy's Python SDK queries models, submits inference jobs and returns results directly to your editor.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - modzyopensource
